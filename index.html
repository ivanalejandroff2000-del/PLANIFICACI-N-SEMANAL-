<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificación Semanal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 15px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .secondary {
      background: #16a34a;
      margin-top: 12px;
    }

    .forgot {
      background: transparent;
      color: #2563eb;
      padding: 10px;
      margin-top: 4px;
      font-size: 14px;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #dc2626;
      min-height: 20px;
    }

    .success {
      color: #16a34a;
    }

    .hidden {
      display: none;
    }

    .dashboard {
      text-align: center;
    }

    .welcome {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .role {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .logout {
      margin-top: 15px;
      background: #111827;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">

    <div class="logo">📅</div>

    <h1>Planificación Semanal</h1>

    <div class="subtitle">
      Ingresa para registrar tu disponibilidad
    </div>

    <form id="loginForm">

      <label for="email">Correo electrónico</label>

      <input
        id="email"
        type="email"
        placeholder="correo@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>

      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <button id="loginButton" type="submit">
        Iniciar sesión
      </button>

      <button
        id="forgotButton"
        type="button"
        class="forgot"
      >
        ¿Olvidaste tu contraseña?
      </button>

      <button
        id="registerButton"
        type="button"
        class="secondary"
      >
        Crear cuenta
      </button>

      <div id="message" class="message"></div>

    </form>
  </div>


  <!-- REGISTRO -->
  <div id="registerCard" class="card hidden">

    <div class="logo">👤</div>

    <h1>Crear cuenta</h1>

    <div class="subtitle">
      Registra tu cuenta para continuar
    </div>

    <form id="registerForm">

      <label for="registerName">Nombre completo</label>

      <input
        id="registerName"
        type="text"
        placeholder="Nombre completo"
        required
      >

      <label for="registerEmail">Correo electrónico</label>

      <input
        id="registerEmail"
        type="email"
        placeholder="correo@ejemplo.com"
        required
      >

      <label for="registerPassword">Contraseña</label>

      <input
        id="registerPassword"
        type="password"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
      >

      <label for="registerPassword2">Confirmar contraseña</label>

      <input
        id="registerPassword2"
        type="password"
        placeholder="Repite tu contraseña"
        minlength="6"
        required
      >

      <button id="createAccountButton" type="submit">
        Crear cuenta
      </button>

      <button
        id="backLoginButton"
        type="button"
        class="forgot"
      >
        Volver a iniciar sesión
      </button>

      <div id="registerMessage" class="message"></div>

    </form>
  </div>


  <!-- RECUPERAR CONTRASEÑA -->
  <div id="forgotCard" class="card hidden">

    <div class="logo">🔐</div>

    <h1>Recuperar contraseña</h1>

    <div class="subtitle">
      Te enviaremos un enlace para crear una nueva contraseña
    </div>

    <form id="forgotForm">

      <label for="forgotEmail">Correo electrónico</label>

      <input
        id="forgotEmail"
        type="email"
        placeholder="correo@ejemplo.com"
        required
      >

      <button id="resetButton" type="submit">
        Enviar enlace
      </button>

      <button
        id="backFromForgot"
        type="button"
        class="forgot"
      >
        Volver a iniciar sesión
      </button>

      <div id="forgotMessage" class="message"></div>

    </form>
  </div>


  <!-- CAMBIAR CONTRASEÑA -->
  <div id="updatePasswordCard" class="card hidden">

    <div class="logo">🔑</div>

    <h1>Nueva contraseña</h1>

    <div class="subtitle">
      Crea una nueva contraseña para tu cuenta
    </div>

    <form id="updatePasswordForm">

      <label for="newPassword">Nueva contraseña</label>

      <input
        id="newPassword"
        type="password"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
      >

      <label for="newPassword2">Confirmar contraseña</label>

      <input
        id="newPassword2"
        type="password"
        placeholder="Repite tu contraseña"
        minlength="6"
        required
      >

      <button id="updatePasswordButton" type="submit">
        Cambiar contraseña
      </button>

      <div id="updateMessage" class="message"></div>

    </form>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboardCard" class="card dashboard hidden">

    <div class="logo">✅</div>

    <div id="welcome" class="welcome">
      Bienvenido
    </div>

    <div id="role" class="role">
      Cargando...
    </div>

    <button class="logout" id="logoutButton">
      Cerrar sesión
    </button>

  </div>

</div>


<script>

  const SUPABASE_URL =
   "https://ousitsihfmjybnlsbtpk.supabase.co"; 

  const SUPABASE_KEY =
    "sb_publishable_YSPb-4X3oizUlXAEBwLQYQ_A8eGM5A3";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loginCard =
    document.getElementById("loginCard");

  const registerCard =
    document.getElementById("registerCard");

  const forgotCard =
    document.getElementById("forgotCard");

  const updatePasswordCard =
    document.getElementById("updatePasswordCard");

  const dashboardCard =
    document.getElementById("dashboardCard");


  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const forgotForm =
    document.getElementById("forgotForm");

  const updatePasswordForm =
    document.getElementById("updatePasswordForm");


  const message =
    document.getElementById("message");

  const registerMessage =
    document.getElementById("registerMessage");

  const forgotMessage =
    document.getElementById("forgotMessage");

  const updateMessage =
    document.getElementById("updateMessage");


  function showOnly(card) {

    loginCard.classList.add("hidden");
    registerCard.classList.add("hidden");
    forgotCard.classList.add("hidden");
    updatePasswordCard.classList.add("hidden");
    dashboardCard.classList.add("hidden");

    card.classList.remove("hidden");
  }


  function clearMessages() {

    message.textContent = "";
    registerMessage.textContent = "";
    forgotMessage.textContent = "";
    updateMessage.textContent = "";

    message.classList.remove("success");
    registerMessage.classList.remove("success");
    forgotMessage.classList.remove("success");
    updateMessage.classList.remove("success");
  }


  // LOGIN

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessages();

    const loginButton =
      document.getElementById("loginButton");

    loginButton.disabled = true;
    loginButton.textContent = "Entrando...";


    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        error.message;

      loginButton.disabled = false;
      loginButton.textContent =
        "Iniciar sesión";

      return;
    }


    await loadProfile(data.user.id);

  });


  // CARGAR PERFIL

  async function loadProfile(userId) {

  try {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("full_name, role")
        .eq("id", userId)
        .single();

    if (error) {
      console.error("Error cargando perfil:", error);

      message.textContent =
        "No se pudo cargar tu perfil: " + error.message;

      const loginButton =
        document.getElementById("loginButton");

      loginButton.disabled = false;
      loginButton.textContent = "Iniciar sesión";

      showOnly(loginCard);
      return;
    }

    showOnly(dashboardCard);

    document.getElementById("welcome").textContent =
      "Hola, " + (data.full_name || "Usuario") + " 👋";

    document.getElementById("role").textContent =
      data.role === "admin"
        ? "Administrador"
        : "Empleado";

  } catch (err) {

    console.error("Error inesperado:", err);

    showOnly(loginCard);

    message.textContent =
      "Ocurrió un error al cargar la aplicación.";

    const loginButton =
      document.getElementById("loginButton");

    loginButton.disabled = false;
    loginButton.textContent = "Iniciar sesión";
  }

}


  // MOSTRAR REGISTRO

  document
    .getElementById("registerButton")
    .addEventListener("click", () => {

      clearMessages();
      registerForm.reset();
      showOnly(registerCard);

    });


  // CREAR CUENTA

  registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessages();

    const button =
      document.getElementById("createAccountButton");

    const fullName =
      document.getElementById("registerName")
        .value
        .trim();

    const email =
      document.getElementById("registerEmail")
        .value
        .trim();

    const password =
      document.getElementById("registerPassword")
        .value;

    const password2 =
      document.getElementById("registerPassword2")
        .value;


    if (password !== password2) {

      registerMessage.textContent =
        "Las contraseñas no coinciden.";

      return;
    }


    if (password.length < 6) {

      registerMessage.textContent =
        "La contraseña debe tener al menos 6 caracteres.";

      return;
    }


    button.disabled = true;
    button.textContent = "Creando cuenta...";


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });


    if (error) {

      registerMessage.textContent =
        error.message;

      button.disabled = false;
      button.textContent =
        "Crear cuenta";

      return;
    }


    if (data.user) {

      const { error: profileError } =
        await supabaseClient
          .from("profiles")
          .upsert({
            id: data.user.id,
            full_name: fullName,
            role: "employee"
          });


      if (profileError) {

        registerMessage.textContent =
          "La cuenta fue creada, pero no se pudo crear el perfil.";

        button.disabled = false;
        button.textContent =
          "Crear cuenta";

        return;
      }
    }


    registerMessage.classList.add("success");

    registerMessage.textContent =
      data.session
        ? "Cuenta creada correctamente."
        : "Cuenta creada. Revisa tu correo para confirmar la cuenta.";


    button.disabled = false;
    button.textContent =
      "Crear cuenta";

  });


  // RECUPERAR CONTRASEÑA

  document
    .getElementById("forgotButton")
    .addEventListener("click", () => {

      clearMessages();

      const email =
        document.getElementById("email").value.trim();

      document.getElementById("forgotEmail").value =
        email;

      showOnly(forgotCard);

    });


  forgotForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessages();

    const button =
      document.getElementById("resetButton");

    const email =
      document.getElementById("forgotEmail")
        .value
        .trim();


    button.disabled = true;
    button.textContent =
      "Enviando...";


    const redirectUrl =
      window.location.origin +
      window.location.pathname;


    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );


    if (error) {

      forgotMessage.textContent =
        error.message;

      button.disabled = false;
      button.textContent =
        "Enviar enlace";

      return;
    }


    forgotMessage.classList.add("success");

    forgotMessage.textContent =
      "Listo. Revisa tu correo para cambiar la contraseña.";


    button.disabled = false;
    button.textContent =
      "Enviar enlace";

  });


  // VOLVER DESDE RECUPERACIÓN

  document
    .getElementById("backFromForgot")
    .addEventListener("click", () => {

      clearMessages();
      showOnly(loginCard);

    });


  // VOLVER DESDE REGISTRO

  document
    .getElementById("backLoginButton")
    .addEventListener("click", () => {

      clearMessages();
      showOnly(loginCard);

    });


  // CAMBIAR CONTRASEÑA

  updatePasswordForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessages();

    const button =
      document.getElementById("updatePasswordButton");

    const password =
      document.getElementById("newPassword")
        .value;

    const password2 =
      document.getElementById("newPassword2")
        .value;


    if (password !== password2) {

      updateMessage.textContent =
        "Las contraseñas no coinciden.";

      return;
    }


    button.disabled = true;
    button.textContent =
      "Guardando...";


    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });


    if (error) {

      updateMessage.textContent =
        error.message;

      button.disabled = false;
      button.textContent =
        "Cambiar contraseña";

      return;
    }


    updateMessage.classList.add("success");

    updateMessage.textContent =
      "Contraseña cambiada correctamente.";


    button.disabled = false;
    button.textContent =
      "Cambiar contraseña";

  });


  // DETECTAR ENLACE DE RECUPERACIÓN

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (event === "PASSWORD_RECOVERY") {

        clearMessages();
        showOnly(updatePasswordCard);

        return;
      }

      if (event === "SIGNED_IN" && session) {

        if (
          !updatePasswordCard.classList.contains("hidden")
        ) {
          return;
        }

        await loadProfile(session.user.id);
      }

    }
  );


  // CERRAR SESIÓN

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      document.getElementById("password").value = "";

      clearMessages();

      showOnly(loginCard);

    });

// DISPONIBILIDAD SEMANAL

const availabilityHTML = `
  <div id="availabilityBox" style="margin-top:25px;text-align:left;">

    <h2 style="font-size:20px;margin-bottom:8px;">
      📅 Disponibilidad semanal
    </h2>

    <p style="color:#6b7280;font-size:14px;margin-bottom:15px;">
      Selecciona los días que estás disponible para trabajar.
    </p>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Lunes
      <input id="availMonday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Martes
      <input id="availTuesday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Miércoles
      <input id="availWednesday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Jueves
      <input id="availThursday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Viernes
      <input id="availFriday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;">
      Sábado
      <input id="availSaturday" type="checkbox">
    </label>

    <label style="display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:15px;">
      Domingo
      <input id="availSunday" type="checkbox">
    </label>

    <button id="saveAvailabilityButton" type="button">
      Guardar disponibilidad
    </button>

    <div id="availabilityMessage" class="message"></div>

  </div>
`;

document
  .getElementById("logoutButton")
  .insertAdjacentHTML("beforebegin", availabilityHTML);


function getMonday() {

  const date = new Date();
  const day = date.getDay();

  const diff = day === 0 ? -6 : 1 - day;

  date.setDate(date.getDate() + diff);

  return date.toISOString().split("T")[0];
}


async function loadAvailability() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) return;

  const weekStart = getMonday();

  const { data, error } =
    await supabaseClient
      .from("weekly_availability")
      .select("*")
      .eq("employee_id", user.id)
      .eq("week_start", weekStart)
      .maybeSingle();

  if (error) {

    console.error(
      "Error cargando disponibilidad:",
      error
    );

    return;
  }

  if (!data) return;

  document.getElementById("availMonday").checked =
    !!data.monday;

  document.getElementById("availTuesday").checked =
    !!data.tuesday;

  document.getElementById("availWednesday").checked =
    !!data.wednesday;

  document.getElementById("availThursday").checked =
    !!data.thursday;

  document.getElementById("availFriday").checked =
    !!data.friday;

  document.getElementById("availSaturday").checked =
    !!data.saturday;

  document.getElementById("availSunday").checked =
    !!data.sunday; 
  if (data.confirmed) {
  document.querySelectorAll('#availabilityBox input[type="checkbox"]')
    .forEach(input => input.disabled = true);
}
}


document
  .getElementById("saveAvailabilityButton")
  .addEventListener("click", async () => {

    const button =
      document.getElementById(
        "saveAvailabilityButton"
      );

    const msg =
      document.getElementById(
        "availabilityMessage"
      );

    button.disabled = true;
    button.textContent = "Guardando...";

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

      msg.textContent =
        "La sesión expiró. Inicia sesión nuevamente.";

      button.disabled = false;
      button.textContent =
        "Guardar disponibilidad";

      return;
    }

    const payload = {

      employee_id: user.id,

      week_start: getMonday(),

      monday:
        document.getElementById(
          "availMonday"
        ).checked,

      tuesday:
        document.getElementById(
          "availTuesday"
        ).checked,

      wednesday:
        document.getElementById(
          "availWednesday"
        ).checked,

      thursday:
        document.getElementById(
          "availThursday"
        ).checked,

      friday:
        document.getElementById(
          "availFriday"
        ).checked,

      saturday:
        document.getElementById(
          "availSaturday"
        ).checked,

      sunday:
        document.getElementById(
          "availSunday"
        ).checked,

      confirmed: true
    };


    const { error } =
      await supabaseClient
        .from("weekly_availability")
        .upsert(
          payload,
          {
            onConflict:
              "employee_id,week_start"
          }
        );


    if (error) {

      console.error(error);

      msg.classList.remove("success");

      msg.textContent =
        "No se pudo guardar: " +
        error.message;

    } else {

      msg.classList.add("success");

      msg.textContent =
        "Disponibilidad guardada correctamente. ✅";
    }
    document.querySelectorAll('#availabilityBox input[type="checkbox"]')
  .forEach(input => input.disabled = true);


    button.disabled = false;

    button.textContent =
      "Guardar disponibilidad";

  });


loadAvailability();
  // COMPROBAR SESIÓN EXISTENTE

  async function checkSession() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      await loadProfile(session.user.id);

    }

  }


  checkSession();

</script>

</body>
</html>
