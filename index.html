<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificación Semanal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 15px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #dc2626;
      min-height: 20px;
    }

    .hidden {
      display: none;
    }

    .dashboard {
      text-align: center;
    }

    .welcome {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .role {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .logout {
      margin-top: 15px;
      background: #111827;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginCard" class="card">

    <div class="logo">📅</div>

    <h1>Planificación Semanal</h1>

    <div class="subtitle">
      Ingresa para registrar tu disponibilidad
    </div>

    <form id="loginForm">

      <label for="email">Correo electrónico</label>

      <input
        id="email"
        type="email"
        placeholder="correo@ejemplo.com"
        required
      >

      <label for="password">Contraseña</label>

      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <button id="loginButton" type="submit">
        Iniciar sesión
      </button>

      <div id="message" class="message"></div>

    </form>
  </div>


  <div id="dashboardCard" class="card dashboard hidden">

    <div class="logo">✅</div>

    <div id="welcome" class="welcome">
      Bienvenido
    </div>

    <div id="role" class="role">
      Cargando...
    </div>

    <button class="logout" id="logoutButton">
      Cerrar sesión
    </button>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://ousitsihfmjbnlsbtpk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_YSPb-4X3oizUlXAEBwLQYQ_A8eGM5A3";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loginCard =
    document.getElementById("loginCard");

  const dashboardCard =
    document.getElementById("dashboardCard");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const welcome =
    document.getElementById("welcome");

  const role =
    document.getElementById("role");

  const logoutButton =
    document.getElementById("logoutButton");


  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    message.textContent = "";

    loginButton.disabled = true;
    loginButton.textContent = "Entrando...";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      message.textContent =
        "Correo o contraseña incorrectos.";

      loginButton.disabled = false;
      loginButton.textContent = "Iniciar sesión";

      return;
    }


    await loadProfile(data.user.id);

  });


  async function loadProfile(userId) {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("full_name, role")
        .eq("id", userId)
        .single();


    if (error) {

      message.textContent =
        "No se pudo cargar tu perfil.";

      loginButton.disabled = false;
      loginButton.textContent = "Iniciar sesión";

      return;
    }


    loginCard.classList.add("hidden");
    dashboardCard.classList.remove("hidden");


    welcome.textContent =
      "Hola, " + data.full_name + " 👋";


    if (data.role === "admin") {

      role.textContent =
        "Administrador";

    } else {

      role.textContent =
        "Empleado";
    }

  }


  logoutButton.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    dashboardCard.classList.add("hidden");
    loginCard.classList.remove("hidden");

    document.getElementById("password").value = "";

    loginButton.disabled = false;
    loginButton.textContent = "Iniciar sesión";

  });


  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      await loadProfile(session.user.id);

    }

  }


const registerButton = document.createElement("button");

registerButton.textContent = "Crear cuenta";
registerButton.style.marginTop = "12px";
registerButton.style.background = "#16a34a";

loginForm.appendChild(registerButton);

registerButton.addEventListener("click", async (event) => {

  event.preventDefault();

  const fullName = prompt("Escribe tu nombre completo:");
  if (!fullName) return;

  const email = prompt("Escribe tu correo electrónico:");
  if (!email) return;

  const password = prompt("Crea una contraseña:");
  if (!password) return;

  registerButton.disabled = true;
  registerButton.textContent = "Creando cuenta...";

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email.trim(),
      password: password
    });

  if (error) {
    message.textContent = error.message;
    registerButton.disabled = false;
    registerButton.textContent = "Crear cuenta";
    return;
  }

  if (data.user) {

    const { error: profileError } =
      await supabaseClient
        .from("profiles")
        .insert({
          id: data.user.id,
          full_name: fullName.trim(),
          role: "employee"
        });

    if (profileError) {
      message.textContent =
        "Cuenta creada, pero hubo un problema creando tu perfil.";
      return;
    }
  }

  message.style.color = "#16a34a";
  message.textContent =
    "Cuenta creada correctamente. Ya puedes iniciar sesión.";

  registerButton.disabled = false;
  registerButton.textContent = "Crear cuenta";

});  checkSession();

</script>

</body>
</html>
